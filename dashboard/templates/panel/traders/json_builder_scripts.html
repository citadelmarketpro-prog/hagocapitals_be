<!-- Visual JSON Builder Scripts for the Trader form.
     Ported from orchard_capitals' dashboard/json_builder_scripts.html, restyled
     to HagoCapitals' dark green admin theme. Each builder hides its plain JSON
     textarea and inserts a friendlier widget (chips / add-a-row rows) in front
     of it; the textarea's value is kept in sync under the hood, so the form
     still posts the exact same JSON string it always did — no backend or
     TraderForm change needed. -->
<style>
  .jb-row     { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .jb-input   { flex:1; min-width:120px; padding:8px 12px; background:#131c2e; border:1px solid #263353; border-radius:6px; color:#f8fafc; font-size:13px; }
  .jb-input::placeholder { color:#475569; }
  .jb-select  { padding:8px 12px; background:#131c2e; border:1px solid #263353; border-radius:6px; color:#f8fafc; font-size:13px; }
  .jb-btn-add    { padding:8px 16px; background:#6366f1; color:#131c2e; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .jb-btn-add:hover { opacity:.9; }
  .jb-btn-remove { padding:6px 12px; background:transparent; color:#f87171; border:1px solid #4a2020; border-radius:6px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .jb-btn-remove:hover { background:#2a1414; }
  .jb-chip    { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; background:#1b2438; border:1px solid #263353; color:#6366f1; border-radius:999px; font-size:12px; font-weight:500; }
  .jb-chip button { background:none; border:none; color:#6366f1; font-weight:700; cursor:pointer; font-size:13px; line-height:1; padding:0; }
  .jb-chip button:hover { color:#f87171; }
  .jb-chips   { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .jb-card    { padding:12px; background:#131c2e; border:1px solid #263353; border-radius:6px; }
  .jb-cards   { display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
  .jb-grid2   { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .jb-grid3   { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .jb-hint    { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:4px; font-size:11px; color:#94a3b8; text-align:center; }
  .jb-pct     { font-size:13px; color:#94a3b8; }

  /* Narrow phones: stack the asset-row sub-grids to 1 column instead of
     squeezing 2-3 fields into ~90px each. */
  @media (max-width: 480px) {
    .jb-grid2, .jb-grid3, .jb-hint { grid-template-columns: 1fr; }
    .jb-select { width: 100%; }
  }
</style>
<script>
// ============================================================================
// TAGS BUILDER
// ============================================================================
function initTagsBuilder(inputId) {
    const textarea = document.getElementById(inputId);
    if (!textarea) return;
    const container = document.createElement('div');
    container.className = 'mb-2';

    const tagsContainer = document.createElement('div');
    tagsContainer.className = 'jb-chips';

    const inputWrapper = document.createElement('div');
    inputWrapper.className = 'jb-row';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Enter a tag…';
    input.className = 'jb-input';

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = 'Add Tag';
    addBtn.className = 'jb-btn-add';

    let tags = [];
    try {
        const existing = textarea.value.trim();
        if (existing) tags = JSON.parse(existing);
    } catch (e) {}

    // Renders chips and rebinds each remove button to its own index, so
    // duplicate tag text never causes the wrong chip to be removed.
    function renderTagsIndexed() {
        tagsContainer.innerHTML = '';
        tags.forEach((tag, idx) => {
            const chip = document.createElement('div');
            chip.className = 'jb-chip';
            chip.innerHTML = `<span>${tag}</span><button type="button">×</button>`;
            chip.querySelector('button').addEventListener('click', () => {
                tags.splice(idx, 1);
                renderTagsIndexed();
            });
            tagsContainer.appendChild(chip);
        });
        textarea.value = tags.length ? JSON.stringify(tags) : '';
    }

    addBtn.addEventListener('click', () => {
        const val = input.value.trim();
        if (val) {
            tags.push(val);
            input.value = '';
            renderTagsIndexed();
        }
    });

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
    });

    inputWrapper.appendChild(input);
    inputWrapper.appendChild(addBtn);
    container.appendChild(tagsContainer);
    container.appendChild(inputWrapper);

    textarea.style.display = 'none';
    textarea.parentNode.insertBefore(container, textarea);

    renderTagsIndexed();
}

// ============================================================================
// PORTFOLIO BREAKDOWN BUILDER — [{name, percentage}]
// ============================================================================
function initPortfolioBuilder(textareaId) {
    const textarea = document.getElementById(textareaId);
    if (!textarea) return;
    const container = document.createElement('div');

    const itemsContainer = document.createElement('div');
    itemsContainer.className = 'jb-cards';

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = '+ Add Portfolio Item';
    addBtn.className = 'jb-btn-add';

    let items = [];
    const categories = ['ETF', 'Stocks', 'Crypto', 'Forex', 'Commodities', 'Futures', 'Options', 'Bonds', 'Real Estate', 'Cash', 'Other'];

    try {
        const existing = textarea.value.trim();
        if (existing) items = JSON.parse(existing);
    } catch (e) {}

    function renderItems() {
        itemsContainer.innerHTML = '';
        items.forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = 'jb-row';

            let categoryOptions = '<option value="">Select or type custom…</option>';
            categories.forEach((cat) => {
                categoryOptions += `<option value="${cat}" ${item.name === cat ? 'selected' : ''}>${cat}</option>`;
            });

            row.innerHTML = `
                <select class="jb-select">${categoryOptions}</select>
                <input type="text" value="${item.name || ''}" placeholder="Or type custom" class="jb-input">
                <input type="number" value="${item.percentage || ''}" placeholder="e.g. 25" class="jb-input" style="max-width:90px;">
                <span class="jb-pct">%</span>
                <button type="button" class="jb-btn-remove">✕</button>
            `;
            const [select, nameInput, pctInput] = row.querySelectorAll('select, input');
            select.addEventListener('change', () => {
                if (select.value) { items[idx].name = select.value; renderItems(); }
            });
            nameInput.addEventListener('change', () => { items[idx].name = nameInput.value; textarea.value = JSON.stringify(items); });
            pctInput.addEventListener('change', () => { items[idx].percentage = parseFloat(pctInput.value) || 0; textarea.value = JSON.stringify(items); });
            row.querySelector('.jb-btn-remove').addEventListener('click', () => { items.splice(idx, 1); renderItems(); });

            itemsContainer.appendChild(row);
        });
        textarea.value = items.length ? JSON.stringify(items) : '';
    }

    addBtn.addEventListener('click', () => { items.push({ name: '', percentage: 0 }); renderItems(); });

    container.appendChild(itemsContainer);
    container.appendChild(addBtn);
    textarea.style.display = 'none';
    textarea.parentNode.insertBefore(container, textarea);
    renderItems();
}

// ============================================================================
// TOP TRADED ASSETS BUILDER — [{name, ticker, avg_profit, avg_loss, profitable_pct}]
// ============================================================================
function initTopTradedBuilder(textareaId) {
    const textarea = document.getElementById(textareaId);
    if (!textarea) return;
    const container = document.createElement('div');

    const itemsContainer = document.createElement('div');
    itemsContainer.className = 'jb-cards';

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = '+ Add Asset';
    addBtn.className = 'jb-btn-add';

    let items = [];
    const popularAssets = {
        'AAPL': 'Apple Inc', 'MSFT': 'Microsoft Corp', 'GOOGL': 'Alphabet Inc', 'AMZN': 'Amazon.com Inc',
        'TSLA': 'Tesla Inc', 'META': 'Meta Platforms', 'NVDA': 'NVIDIA Corp', 'JPM': 'JPMorgan Chase',
        'V': 'Visa Inc', 'WMT': 'Walmart Inc',
        'BTC': 'Bitcoin', 'ETH': 'Ethereum', 'BNB': 'Binance Coin', 'SOL': 'Solana', 'XRP': 'Ripple',
        'ADA': 'Cardano', 'DOGE': 'Dogecoin', 'MATIC': 'Polygon',
        'EUR/USD': 'Euro/US Dollar', 'GBP/USD': 'British Pound/US Dollar', 'USD/JPY': 'US Dollar/Japanese Yen',
        'USD/CHF': 'US Dollar/Swiss Franc', 'AUD/USD': 'Australian Dollar/US Dollar',
        'GOLD': 'Gold', 'SILVER': 'Silver', 'OIL': 'Crude Oil', 'GAS': 'Natural Gas',
    };

    try {
        const existing = textarea.value.trim();
        if (existing) items = JSON.parse(existing);
    } catch (e) {}

    function renderItems() {
        itemsContainer.innerHTML = '';
        items.forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = 'jb-card';

            let assetOptions = '<option value="">Select Asset or type custom</option>';
            for (const [ticker, name] of Object.entries(popularAssets)) {
                assetOptions += `<option value="${ticker}" ${item.ticker === ticker ? 'selected' : ''}>${ticker} — ${name}</option>`;
            }

            row.innerHTML = `
                <div class="jb-grid2">
                    <select class="jb-select">${assetOptions}</select>
                    <input type="text" value="${item.ticker || ''}" placeholder="Or enter ticker" class="jb-input">
                </div>
                <div style="margin-bottom:8px;">
                    <input type="text" value="${item.name || ''}" placeholder="Asset Name" class="jb-input" style="width:100%;">
                </div>
                <div class="jb-grid3">
                    <input type="number" step="0.1" value="${item.avg_profit ?? ''}" placeholder="e.g. 12.5" class="jb-input">
                    <input type="number" step="0.1" value="${item.avg_loss ?? ''}" placeholder="e.g. -3.2" class="jb-input">
                    <input type="number" value="${item.profitable_pct ?? ''}" placeholder="e.g. 78" class="jb-input">
                </div>
                <div class="jb-hint"><span>Avg Profit %</span><span>Avg Loss %</span><span>Profitable %</span></div>
                <div style="margin-top:8px;"><button type="button" class="jb-btn-remove">Remove</button></div>
            `;
            const select = row.querySelector('select');
            const inputs = row.querySelectorAll('input');
            const tickerEl = inputs[0], nameEl = inputs[1], profitEl = inputs[2], lossEl = inputs[3], pctEl = inputs[4];

            select.addEventListener('change', () => {
                if (select.value && popularAssets[select.value]) {
                    items[idx].ticker = select.value;
                    items[idx].name = popularAssets[select.value];
                    renderItems();
                }
            });
            tickerEl.addEventListener('change', () => { items[idx].ticker = tickerEl.value; textarea.value = JSON.stringify(items); });
            nameEl.addEventListener('change', () => { items[idx].name = nameEl.value; textarea.value = JSON.stringify(items); });
            profitEl.addEventListener('change', () => { items[idx].avg_profit = parseFloat(profitEl.value) || 0; textarea.value = JSON.stringify(items); });
            lossEl.addEventListener('change', () => { items[idx].avg_loss = parseFloat(lossEl.value) || 0; textarea.value = JSON.stringify(items); });
            pctEl.addEventListener('change', () => { items[idx].profitable_pct = parseInt(pctEl.value, 10) || 0; textarea.value = JSON.stringify(items); });
            row.querySelector('.jb-btn-remove').addEventListener('click', () => { items.splice(idx, 1); renderItems(); });

            itemsContainer.appendChild(row);
        });
        textarea.value = items.length ? JSON.stringify(items) : '';
    }

    addBtn.addEventListener('click', () => {
        items.push({ name: '', ticker: '', avg_profit: 0, avg_loss: 0, profitable_pct: 0 });
        renderItems();
    });

    container.appendChild(itemsContainer);
    container.appendChild(addBtn);
    textarea.style.display = 'none';
    textarea.parentNode.insertBefore(container, textarea);
    renderItems();
}

// ============================================================================
// PERFORMANCE DATA BUILDER (Monthly) — [{month, value}] or [{month, percentage}]
// ============================================================================
function initPerformanceBuilder(textareaId, isPercentage) {
    const textarea = document.getElementById(textareaId);
    if (!textarea) return;
    const container = document.createElement('div');

    const itemsContainer = document.createElement('div');
    itemsContainer.className = 'jb-cards';

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = '+ Add Month';
    addBtn.className = 'jb-btn-add';

    let items = [];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    try {
        const existing = textarea.value.trim();
        if (existing) items = JSON.parse(existing);
    } catch (e) {}

    function renderItems() {
        itemsContainer.innerHTML = '';
        const valueKey = isPercentage ? 'percentage' : 'value';
        items.forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = 'jb-row';

            let monthOptions = '<option value="">Select month…</option>';
            months.forEach((m) => { monthOptions += `<option value="${m}" ${item.month === m ? 'selected' : ''}>${m}</option>`; });

            const placeholder = isPercentage ? 'e.g. 12.5' : 'e.g. 1500';
            row.innerHTML = `
                <select class="jb-select" style="width:110px;">${monthOptions}</select>
                <input type="number" step="0.01" value="${item[valueKey] ?? ''}" placeholder="${placeholder}" class="jb-input">
                ${isPercentage ? '<span class="jb-pct">%</span>' : ''}
                <button type="button" class="jb-btn-remove">✕</button>
            `;
            const select = row.querySelector('select');
            const valInput = row.querySelector('input');
            select.addEventListener('change', () => { items[idx].month = select.value; textarea.value = JSON.stringify(items); });
            valInput.addEventListener('change', () => { items[idx][valueKey] = parseFloat(valInput.value) || 0; textarea.value = JSON.stringify(items); });
            row.querySelector('.jb-btn-remove').addEventListener('click', () => { items.splice(idx, 1); renderItems(); });

            itemsContainer.appendChild(row);
        });
        textarea.value = items.length ? JSON.stringify(items) : '';
    }

    addBtn.addEventListener('click', () => {
        const newItem = { month: '' };
        newItem[isPercentage ? 'percentage' : 'value'] = 0;
        items.push(newItem);
        renderItems();
    });

    container.appendChild(itemsContainer);
    container.appendChild(addBtn);
    textarea.style.display = 'none';
    textarea.parentNode.insertBefore(container, textarea);
    renderItems();
}

// ============================================================================
// FREQUENTLY TRADED BUILDER — simple ticker list
// ============================================================================
function initFrequentlyTradedBuilder(textareaId) {
    const textarea = document.getElementById(textareaId);
    if (!textarea) return;
    const container = document.createElement('div');

    const itemsContainer = document.createElement('div');
    itemsContainer.className = 'jb-chips';

    const inputWrapper = document.createElement('div');
    inputWrapper.className = 'jb-row';

    const select = document.createElement('select');
    select.className = 'jb-select';
    select.style.minWidth = '160px';

    const popularAssets = {
        'AAPL': 'Apple Inc', 'MSFT': 'Microsoft', 'GOOGL': 'Alphabet', 'AMZN': 'Amazon',
        'TSLA': 'Tesla', 'META': 'Meta', 'NVDA': 'NVIDIA', 'JPM': 'JPMorgan',
        'V': 'Visa', 'WMT': 'Walmart', 'DIS': 'Disney', 'NFLX': 'Netflix',
        'BTC': 'Bitcoin', 'ETH': 'Ethereum', 'BNB': 'Binance Coin', 'SOL': 'Solana',
        'XRP': 'Ripple', 'ADA': 'Cardano', 'DOGE': 'Dogecoin', 'MATIC': 'Polygon',
        'DOT': 'Polkadot', 'AVAX': 'Avalanche',
        'EUR/USD': 'Euro/Dollar', 'GBP/USD': 'Pound/Dollar', 'USD/JPY': 'Dollar/Yen',
        'USD/CHF': 'Dollar/Franc', 'AUD/USD': 'Aussie/Dollar', 'USD/CAD': 'Dollar/Loonie',
        'GOLD': 'Gold', 'SILVER': 'Silver', 'OIL': 'Crude Oil', 'GAS': 'Natural Gas',
        'COPPER': 'Copper', 'WHEAT': 'Wheat',
    };

    select.innerHTML = '<option value="">Select an asset…</option>';
    for (const [ticker, name] of Object.entries(popularAssets)) {
        select.innerHTML += `<option value="${ticker}">${ticker} — ${name}</option>`;
    }

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Or type custom ticker…';
    input.className = 'jb-input';

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = 'Add';
    addBtn.className = 'jb-btn-add';

    let assets = [];
    try {
        const existing = textarea.value.trim();
        if (existing) assets = JSON.parse(existing);
    } catch (e) {}

    function renderAssets() {
        itemsContainer.innerHTML = '';
        assets.forEach((asset, idx) => {
            const chip = document.createElement('div');
            chip.className = 'jb-chip';
            chip.innerHTML = `<span>${asset}</span><button type="button">×</button>`;
            chip.querySelector('button').addEventListener('click', () => { assets.splice(idx, 1); renderAssets(); });
            itemsContainer.appendChild(chip);
        });
        textarea.value = assets.length ? JSON.stringify(assets) : '';
    }

    addBtn.addEventListener('click', () => {
        const val = select.value || input.value.trim();
        if (val && !assets.includes(val)) {
            assets.push(val);
            select.value = '';
            input.value = '';
            renderAssets();
        }
    });
    select.addEventListener('change', () => { if (select.value) input.value = ''; });
    input.addEventListener('input', () => { if (input.value) select.value = ''; });
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); } });

    inputWrapper.appendChild(select);
    inputWrapper.appendChild(input);
    inputWrapper.appendChild(addBtn);
    container.appendChild(itemsContainer);
    container.appendChild(inputWrapper);

    textarea.style.display = 'none';
    textarea.parentNode.insertBefore(container, textarea);
    renderAssets();
}

// ============================================================================
// RE-INITIALISE A BUILDER WITH NEW DATA (used by "Load Preset")
// Removes the previously injected builder UI, resets the textarea, then
// calls the builder init function again so the visual UI reflects new data.
// ============================================================================
function reInitJsonBuilder(fieldId, initFn, jsonValue) {
    const textarea = document.getElementById(fieldId);
    if (!textarea) return;
    const prev = textarea.previousElementSibling;
    if (prev && prev !== textarea) prev.remove();
    textarea.style.display = '';
    textarea.value = (jsonValue && jsonValue.length) ? JSON.stringify(jsonValue) : '';
    initFn(fieldId);
}

// ============================================================================
// INITIALIZE ALL BUILDERS ON PAGE LOAD
// ============================================================================
document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('id_tags'))                 initTagsBuilder('id_tags');
    if (document.getElementById('id_portfolio_breakdown'))   initPortfolioBuilder('id_portfolio_breakdown');
    if (document.getElementById('id_top_traded'))            initTopTradedBuilder('id_top_traded');
    if (document.getElementById('id_performance_data'))      initPerformanceBuilder('id_performance_data', false);
    if (document.getElementById('id_monthly_performance'))   initPerformanceBuilder('id_monthly_performance', true);
    if (document.getElementById('id_frequently_traded'))     initFrequentlyTradedBuilder('id_frequently_traded');
});
</script>
